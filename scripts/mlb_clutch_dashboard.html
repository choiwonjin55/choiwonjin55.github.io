<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2023~2026 MLB 득점권 타격 비교</title>
<style>
:root{color-scheme:light;font-family:system-ui,"Malgun Gothic",sans-serif;color:#243a40;background:#fbfaf7}
*{box-sizing:border-box}body{margin:0;padding:26px 18px}main{max-width:1060px;margin:auto}h1{font-size:clamp(22px,4vw,32px);line-height:1.35;margin:0 0 12px}h2{font-size:19px}p{line-height:1.7}a{color:#126b80}.muted{color:#596e76;font-size:14px}.controls{display:flex;flex-wrap:wrap;gap:16px;margin:22px 0}label{display:grid;gap:7px;flex:1;min-width:200px}select{width:100%;padding:10px;border:1px solid #b5c5c8;border-radius:8px;background:#fff;color:inherit;font:inherit}button{padding:9px 14px;border-radius:7px;border:1px solid #b5c5c8;background:#fff;cursor:pointer;color:inherit;font:inherit}button:focus-visible,select:focus-visible{outline:3px solid #da7750;outline-offset:2px}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(250px,1fr);gap:24px}.plot{min-width:0}svg{display:block;width:100%;height:auto;touch-action:pan-y}.point{cursor:pointer;stroke:#fbfaf7;stroke-width:.7}.point:focus{outline:none;stroke:#243a40;stroke-width:3}.selected{stroke:#243a40;stroke-width:3}.legend{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:13px}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--color);margin-right:5px}.card{background:#fff;border:1px solid #d6e0e0;border-radius:12px;padding:18px;height:fit-content}.card h2{margin:0 0 12px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:right;padding:10px 5px;border-bottom:1px solid #e3e8e8;white-space:nowrap}th:first-child,td:first-child{text-align:left}img{display:block;width:100%;height:auto;border-radius:9px}.figure{margin-top:38px}.summary{font-size:17px}.result{font-weight:650;color:#126b80}#selection-note{min-height:25px}.limits{border-top:1px solid #d6e0e0;margin-top:30px;padding-top:12px}footer{margin:25px 0;font-size:13px;line-height:1.8}@media(max-width:740px){body{padding:20px 12px}.layout{grid-template-columns:1fr}.controls{gap:10px}label{min-width:160px}.card{padding:14px}}
</style>
</head>
<body><main>
<h1>2023~2026 MLB 득점권 타격 비교</h1>
<p class="summary">평소보다 득점권에서 더 잘 쳤던 선수가 다음 해에도 비슷한 차이를 보였는지 비교했다.</p>
<p class="muted">같은 선수 <strong id="n"></strong>명의 <span id="period"></span>년 기록 비교</p>
<div class="controls">
<label>비교 시즌<select id="season-pair"></select></label>
<label>비교 지표<select id="metric"><option value="delta">득타율 − 전체 타율</option><option value="contrast">득점권 − 비득점권 타율</option><option value="avg">전체 타율</option><option value="risp_avg">득점권 타율</option></select></label>
<label>선수 선택<select id="player"><option value="">전체 선수</option></select></label>
</div>
<p id="correlation" class="result"></p>
<div class="layout"><section class="plot" aria-label="연도 간 산점도">
<svg id="scatter" viewBox="0 0 760 570" role="img" aria-labelledby="chart-title chart-description"><title id="chart-title"></title><desc id="chart-description">각 점은 같은 선수의 두 시즌 기록입니다. 가로축은 2025년, 세로축은 2026년입니다. 점을 선택하거나 선수 선택 메뉴를 사용하면 상세 기록을 볼 수 있습니다.</desc></svg>
<div class="legend"><span style="--color:#df744d">2025년 차이 상위 20%</span><span style="--color:#157b8c">2025년 차이 하위 20%</span><span style="--color:#84959e">중간 선수</span></div>
</section>
<aside class="card" aria-live="polite"><h2 id="selected-name">선수별 기록</h2><p id="selection-note" class="muted">선수를 선택하세요.</p><div id="details" hidden class="tablewrap"><table><thead><tr><th>항목</th><th id="before-year"></th><th id="after-year"></th></tr></thead><tbody id="detail-rows"></tbody></table><p id="groups" class="muted"></p><a id="official" target="_blank" rel="noopener">MLB 공식 기록</a></div><button id="reset" type="button">선택 해제</button></aside></div>
<noscript><img src="../assets/mlb-clutch-2026/four-season-persistence.png" alt="2023~2026년 연속 시즌 세 쌍의 득타율 차이 비교"></noscript>
</main>
<script id="analysis-data" type="application/json">__CLUTCH_PAYLOAD__</script>
<script>
'use strict';
const payload=JSON.parse(document.getElementById('analysis-data').textContent);
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const names={delta:'득타율 − 전체 타율',contrast:'득점권 − 비득점권 타율',avg:'전체 타율',risp_avg:'득점권 타율'};
const groupNames={top:'상위권',bottom:'하위권',middle:'중간'};
let selected=null,comparison,players,before,after;
for(const [key,pair] of Object.entries(payload.pairs)){const option=document.createElement('option');option.value=key;option.textContent=pair.before+' → '+pair.after;$('season-pair').appendChild(option);}
$('season-pair').value=payload.default_pair;
function switchPair(){comparison=payload.pairs[$('season-pair').value];players=comparison.players;before=comparison.before;after=comparison.after;
 $('n').textContent=players.length;$('period').textContent=before+'·'+after;$('before-year').textContent=before;$('after-year').textContent=after;
 $('scatter').querySelector('desc').textContent='각 점은 같은 선수의 두 시즌 기록입니다. 가로축은 '+before+'년, 세로축은 '+after+'년입니다.';
 $('player').replaceChildren(new Option('전체 선수',''));
 for(const p of [...players].sort((a,b)=>a['name_'+after].localeCompare(b['name_'+after]))){$('player').appendChild(new Option(p['name_'+after],p.player_id));}
 document.querySelectorAll('.legend span')[0].lastChild.textContent=before+'년 차이 상위 20%';document.querySelectorAll('.legend span')[1].lastChild.textContent=before+'년 차이 하위 20%';
 if(!players.some(p=>p.player_id===selected))selected=null;draw();
}
const elem=(tag,attrs,text)=>{const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e;};
const signed=v=>(v>=0?'+':'')+v.toFixed(3);
const avg=v=>v.toFixed(3);
function choose(id){selected=id?Number(id):null;$('player').value=selected?String(selected):'';const p=players.find(p=>p.player_id===selected);$('details').hidden=!p;$('selection-note').hidden=!!p;$('selected-name').textContent=p?p['name_'+after]:'선수별 기록';
 if(p){$('detail-rows').replaceChildren();const rows=[['전체 타수',p['ab_'+before],p['ab_'+after]],['전체 안타',p['h_'+before],p['h_'+after]],['득점권 타수',p['risp_ab_'+before],p['risp_ab_'+after]],['득점권 안타',p['risp_h_'+before],p['risp_h_'+after]],['전체 타율',avg(p['avg_'+before]),avg(p['avg_'+after])],['득점권 타율',avg(p['risp_avg_'+before]),avg(p['risp_avg_'+after])],['타율 차이',signed(p['delta_'+before]),signed(p['delta_'+after])]];
  for(const row of rows){const tr=document.createElement('tr');for(const value of row){const td=document.createElement('td');td.textContent=value;tr.appendChild(td);}$('detail-rows').appendChild(tr);}
  $('groups').textContent='타율 차이 순위: '+groupNames[p['group_'+before]]+' → '+groupNames[p['group_'+after]];$('official').href='https://www.mlb.com/player/'+p.player_id;
 }
 for(const c of $('scatter').querySelectorAll('.point')){const active=Number(c.dataset.id)===selected;c.classList.toggle('selected',active);c.setAttribute('r',active?8:4.7);}
 fitClutchFrame();
}
function draw(){const m=$('metric').value,s=comparison.persistence[m],svg=$('scatter');svg.querySelectorAll('.drawing').forEach(e=>e.remove());const root=elem('g',{class:'drawing'});svg.appendChild(root);$('chart-title').textContent=before+'·'+after+' '+names[m]+' 비교';
 $('correlation').textContent='Pearson r = '+s.pearson.toFixed(3)+' (95% 신뢰구간 '+s.pearson_95.map(x=>x.toFixed(3)).join(' ~ ')+') · 순위 상관 = '+s.spearman.toFixed(3);
 const width=Math.max(320,Math.round(svg.getBoundingClientRect().width)),height=Math.min(570,Math.max(400,width*.75));svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
 const values=players.flatMap(p=>[p[m+'_'+before],p[m+'_'+after]]);let lo=Math.min(...values),hi=Math.max(...values);const pad=(hi-lo)*.08;lo-=pad;hi+=pad;
 const X=v=>85+(v-lo)/(hi-lo)*(width-105),Y=v=>height-65-(v-lo)/(hi-lo)*(height-95);
 const format=['delta','contrast'].includes(m)?signed:avg;
 const ticks=width<500?3:5;
 for(let i=0;i<=ticks;i++){const v=lo+(hi-lo)*i/ticks,x=X(v),y=Y(v);root.appendChild(elem('line',{x1:85,y1:y,x2:width-20,y2:y,stroke:'#dde5e5'}));root.appendChild(elem('line',{x1:x,y1:30,x2:x,y2:height-65,stroke:'#edf0f0'}));root.appendChild(elem('text',{x:77,y:y+5,'text-anchor':'end',fill:'#4c6268','font-size':14},v.toFixed(3)));root.appendChild(elem('text',{x,y:height-38,'text-anchor':'middle',fill:'#4c6268','font-size':14},v.toFixed(3)));}
 root.appendChild(elem('text',{x:width/2,y:height-7,'text-anchor':'middle','font-size':16},before+'년'));root.appendChild(elem('text',{x:16,y:height/2,transform:`rotate(-90 16 ${height/2})`,'text-anchor':'middle','font-size':16},after+'년'));
 const xs=players.map(p=>p[m+'_'+before]),ys=players.map(p=>p[m+'_'+after]),mean=a=>a.reduce((s,v)=>s+v,0)/a.length,mx=mean(xs),my=mean(ys);const slope=xs.reduce((s,x,i)=>s+(x-mx)*(ys[i]-my),0)/xs.reduce((s,x)=>s+(x-mx)**2,0),intercept=my-slope*mx;
 root.appendChild(elem('line',{x1:X(lo),y1:Y(intercept+slope*lo),x2:X(hi),y2:Y(intercept+slope*hi),stroke:'#df744d','stroke-width':2}));
 for(const p of players){const c=elem('circle',{cx:X(p[m+'_'+before]),cy:Y(p[m+'_'+after]),r:4.7,fill:{top:'#df744d',bottom:'#157b8c',middle:'#84959e'}[p['group_'+before]],class:'point',tabindex:0,role:'button','aria-label':p['name_'+after]+' '+names[m]+' '+before+' '+format(p[m+'_'+before])+' '+after+' '+format(p[m+'_'+after])});c.dataset.id=p.player_id;c.appendChild(elem('title',{},p['name_'+after]));c.addEventListener('click',()=>choose(p.player_id));c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(p.player_id);}});root.appendChild(c);}
 choose(selected);
}
$('player').addEventListener('change',e=>choose(e.target.value));$('metric').addEventListener('change',draw);$('season-pair').addEventListener('change',switchPair);$('reset').addEventListener('click',()=>choose(null));document.addEventListener('keydown',e=>{if(e.key==='Escape')choose(null);});window.addEventListener('resize',draw);switchPair();
// Size the embedding frame from natural body height, so it can grow and shrink.
function fitClutchFrame(){try{const frame=window.frameElement;if(!frame)return;const height=Math.ceil(document.body.getBoundingClientRect().height)+8;if(Math.abs(frame.clientHeight-height)>1)frame.style.height=height+'px';}catch(error){}}
new ResizeObserver(()=>requestAnimationFrame(fitClutchFrame)).observe(document.body);window.addEventListener('load',fitClutchFrame);if(document.fonts)document.fonts.ready.then(fitClutchFrame);fitClutchFrame();
</script></body></html>
