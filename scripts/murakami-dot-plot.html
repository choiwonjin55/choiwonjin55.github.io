<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>무라카미의 타구 속도와 발사각</title>
<style>
:root{color-scheme:light;--ink:#162b36;--muted:#63747d;--line:#dbe4e8;--blue:#147c9c;--orange:#d86240}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f4f7f8;font-family:"Malgun Gothic",system-ui,sans-serif;line-height:1.6}main{max-width:1120px;padding:24px;margin:auto}h1{font-size:clamp(22px,3vw,32px);margin:0 0 8px;line-height:1.3}p{margin:8px 0}.muted{color:var(--muted);font-size:13px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:18px}.filters,.toggles,.legend{display:flex;flex-wrap:wrap;gap:9px 18px;align-items:center}.filters{gap:8px}.filters button,button.reset{font:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:24px;color:var(--ink)}.filters button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}.toggles{margin:16px 0;font-size:14px}.toggles label{display:flex;gap:8px;align-items:center}input{accent-color:var(--blue)}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #147c9c;outline-offset:3px}.legend{font-size:13px}.key{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:50%;background:#a7afb5}.key.hit{background:var(--blue)}.key.hr{background:var(--orange);border-radius:1px;transform:rotate(45deg)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:24px;align-items:start}#chartbox{min-width:0}svg{width:100%;display:block;touch-action:manipulation;overflow:visible}.dot{cursor:pointer}.dot:focus{outline:none;stroke:#162b36;stroke-width:3}.axis{fill:var(--muted);font-size:12px}.axis-title{fill:var(--ink);font-size:13px}.detail{background:#f3f7f8;border-radius:12px;padding:16px;font-size:14px;min-height:280px}.detail h2{font-size:17px;margin:0 0 10px}.detail dl{margin:10px 0;display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px}.detail dt{color:var(--muted)}.detail dd{margin:0;overflow-wrap:anywhere}.detail select{font:inherit;width:100%;min-width:0;margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}.detail label{display:block;margin-top:18px}.region-list{list-style:none;padding:0;font-size:13px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 16px}.region-list li{padding:6px 9px;background:#f3f7f8;border-radius:5px}#status{margin:10px 0;color:var(--muted);font-size:13px}img{max-width:100%;height:auto}[hidden]{display:none!important}
@media(max-width:720px){main{padding:16px 12px}.card{padding:14px}.layout{grid-template-columns:minmax(0,1fr);gap:12px}.detail{min-height:0}.region-list{grid-template-columns:1fr}.toggles{gap:12px}.filters button{padding:8px 11px}}
</style>
</head>
<body><main>
<h1>무라카미의 타구 속도와 발사각</h1>
<p id="scope"></p>
<section class="card" aria-label="무라카미 타구 산점도">
<div class="filters" aria-label="타구 결과 필터">
<button type="button" data-filter="all" aria-pressed="true">전체</button>
<button type="button" data-filter="hit" aria-pressed="true">홈런 제외 안타</button>
<button type="button" data-filter="hr" aria-pressed="true">홈런</button>
<button type="button" data-filter="nonhit" aria-pressed="true">아웃</button>
</div>
<div class="legend" aria-label="실제 결과 색상"><span><i class="key"></i>아웃</span><span><i class="key hit"></i>홈런 제외 안타</span><span><i class="key hr"></i>홈런</span></div>
<p id="status" role="status" aria-live="polite"></p>
<div class="layout">
<div id="chartbox"><svg id="plot" role="group" aria-label="가로축 타구 속도, 세로축 발사각. 각 점은 실제 타구이며 키보드로 선택할 수 있습니다."></svg></div>
<aside class="detail" aria-label="선택한 타구의 상세 결과"><h2 id="detailtitle">타구별 실제 결과</h2>
<dl id="details" hidden><dt>경기 날짜</dt><dd id="date"></dd><dt>상대 팀</dt><dd id="opponent"></dd><dt>실제 결과</dt><dd id="outcome"></dd><dt>타구 속도</dt><dd id="speed"></dd><dt>발사각</dt><dd id="angle"></dd><dt>추정 비거리</dt><dd id="distance"></dd><dt>구장</dt><dd id="venue"></dd></dl>
<label for="ballselect">타구 목록</label><select id="ballselect"><option value="">타구 선택</option></select>
</aside></div>
<ul class="region-list" id="regionlegend" hidden><li style="border-left:3px dashed #91b7a1">약하게 띄운 타구<br>65~75 mph / 20~35°</li><li style="border-left:3px dashed #147c9c">빠르고 낮은 타구<br>90~105 mph / 5~15°</li><li style="border-left:3px dashed #d86240">강하게 띄운 타구<br>105~115 mph / 25~35°</li><li style="border-left:3px dashed #64747d">중간 속도의 뜬공<br>85~100 mph / 25~35°</li></ul>
</section>

 for(let v=20;v<=120;v+=width<500?20:10){node('line',{x1:x(v),x2:x(v),y1:p.top,y2:p.top+ph,stroke:'#edf1f3'});label(v,x(v),p.top+ph+21,{'text-anchor':'middle',class:'axis'});}
 for(let v=-90;v<=90;v+=30){node('line',{x1:p.left,x2:p.left+pw,y1:y(v),y2:y(v),stroke:'#edf1f3'});label(v,p.left-10,y(v)+4,{'text-anchor':'end',class:'axis'});}
 const overlays=node('g',{'clip-path':'url(#plotclip)'});
 if($('regions')?.checked){for(const [name,b] of Object.entries(data.regions)){const fill={A:'#91b7a1',B:'#147c9c',C:'#d86240',D:'#64747d'}[name];node('rect',{x:x(b[0]),y:y(b[3]),width:x(b[1])-x(b[0]),height:y(b[2])-y(b[3]),fill,'fill-opacity':'.10',stroke:fill,'stroke-dasharray':'4 3'},overlays);}}
 const dots=node('g',{'clip-path':'url(#plotclip)'});
 for(const {r,i} of visible){const cx=x(r.ev),cy=y(r.la),cat=category(r),radius=cat==='hr'?6:4.5;
  const attributes={class:'dot','data-index':i,tabindex:0,role:'button','aria-label':r.date+' '+eventLabel(r)+' '+r.ev+' mph '+r.la+'도',fill:colors[cat],'fill-opacity':cat==='nonhit'?'.6':'.85',stroke:'#fff','stroke-width':'.5'};
  const point=cat==='hr'?node('path',{...attributes,d:`M ${cx} ${cy-radius} L ${cx+radius} ${cy} L ${cx} ${cy+radius} L ${cx-radius} ${cy} Z`},dots):node('circle',{...attributes,cx,cy,r:radius},dots);
  positions.push({i,x:cx,y:cy});point.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch'&&selected===null){hovered=i;showDetail(i);highlight(i);}});
  point.addEventListener('focus',()=>{if(selected===null){showDetail(i);highlight(i);}});
  point.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(i);}if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const at=visible.findIndex(v=>v.i===i),next=visible[(at+(e.key==='ArrowRight'?1:-1)+visible.length)%visible.length].i;choose(next);svg.querySelector('[data-index="'+next+'"]').focus();}});
 }
 node('rect',{x:p.left,y:p.top,width:pw,height:ph,fill:'none',stroke:'#c8d3d8','pointer-events':'none'});
 label('타구 속도 (mph)',p.left+pw/2,height-12,{'text-anchor':'middle',class:'axis-title'});
 label('발사각 (°)',15,p.top+ph/2,{transform:'rotate(-90 15 '+(p.top+ph/2)+')','text-anchor':'middle',class:'axis-title'});
 if($('regionlegend'))$('regionlegend').hidden=!$('regions')?.checked;
 const hr=visible.filter(v=>category(v.r)==='hr').length,hit=visible.filter(v=>category(v.r)==='hit').length;
 $('status').textContent='표시 '+visible.length+'타구';
 $('ballselect').replaceChildren(new Option('타구 선택',''),...visible.map(({r,i})=>new Option(r.date+' · '+eventLabel(r)+' · '+r.ev+' mph / '+r.la+'°',String(i))));
 if(selected!==null&&!visible.some(v=>v.i===selected))selected=null;hovered=null;$('ballselect').value=selected===null?'':String(selected);showDetail(selected);highlight(selected);
}
svg.addEventListener('click',e=>{const bounds=svg.getBoundingClientRect(),cx=(e.clientX-bounds.left)*layout.width/bounds.width,cy=(e.clientY-bounds.top)*layout.height/bounds.height;
 const candidates=positions.map(p=>({...p,d:Math.hypot(p.x-cx,p.y-cy)})).filter(p=>p.d<=18).sort((a,b)=>a.d-b.d);
 if(candidates.length){const nearest=candidates[0];choose(nearest.i);}else choose(null);
});
svg.addEventListener('pointerleave',()=>{hovered=null;showDetail(selected);highlight(selected);});
document.addEventListener('keydown',e=>{if(e.key==='Escape')choose(null);});
document.querySelectorAll('[data-filter]').forEach(button=>{const key=button.dataset.filter;const n=data.balls.filter(r=>key==='all'||category(r)===key).length;button.textContent+=' '+n;button.addEventListener('click',()=>{if(key==='all'){activeCategories.clear();['hit','hr','nonhit'].forEach(k=>activeCategories.add(k));}else if(activeCategories.has(key)){activeCategories.delete(key);}else{activeCategories.add(key);}syncFilters();draw();});});
$('regions')?.addEventListener('change',draw);$('ballselect').addEventListener('change',e=>choose(e.target.value===''?null:+e.target.value));
$('reset')?.addEventListener('click',()=>{activeCategories.clear();['hit','hr','nonhit'].forEach(k=>activeCategories.add(k));selected=null;if($('regions'))$('regions').checked=false;syncFilters();draw();});
if($('scope'))$('scope').textContent=data.balls.length+'타구 · '+data.balls.filter(r=>category(r)==='hr').length+'홈런 · 평균 타구 속도 '+data.meanEV.toFixed(1)+' mph · 95 mph 이상 '+(data.hardHit*100).toFixed(1)+'%';
new ResizeObserver(draw).observe($('chartbox'));draw();
</script></body></html>
