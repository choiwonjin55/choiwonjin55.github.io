function fitClutchFrame(){try{const frame=window.frameElement;if(!frame)return;const height=Math.ceil(document.body.getBoundingClientRect().height)+8;if(Math.abs(frame.clientHeight-height)>1)frame.style.height=height+'px';}catch(error){}}
