<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLB 팀 WAR와 실제 승수 · 2022–2026</title>
<style>
:root{color-scheme:light;--paper:#fbfaf7;--ink:#23343d;--muted:#687a82;--teal:#157b8c;--orange:#df744d;--line:#dddeda}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 "Malgun Gothic",system-ui,sans-serif}main{max-width:1120px;padding:30px 24px 50px;margin:auto}h1{font-size:clamp(24px,4vw,36px);line-height:1.3;margin:6px 0 14px;letter-spacing:-.04em}h2{font-size:19px;margin:0 0 10px}p{margin:10px 0}.eyebrow,.note{color:var(--muted);font-size:13px}.banner{padding:12px 16px;border-left:3px solid var(--orange);background:#fff3e7;border-radius:4px}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end;padding:20px 0;position:relative}.controls label{display:flex;flex-direction:column;gap:4px;font-size:13px}.controls label:last-of-type{flex:1;min-width:180px}select,button{font:inherit;padding:9px 12px;border:1px solid #b9c5c6;border-radius:7px;background:white;color:var(--ink);min-height:42px;max-width:100%}button{cursor:pointer}button:hover{border-color:var(--teal)}button:focus-visible,select:focus-visible,.point:focus-visible{outline:3px solid var(--orange);outline-offset:3px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.card{padding:15px;background:#fff;border:1px solid var(--line);border-radius:9px}.card span{display:block;color:var(--muted);font-size:12px}.card strong{font-size:24px;font-variant-numeric:tabular-nums}.plots{display:grid;grid-template-columns:1fr 1fr;gap:18px}section.plot{background:white;border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}.wide{grid-column:1/-1}svg{display:block;width:100%;height:auto;overflow:visible}svg text{font:12px "Malgun Gothic",system-ui,sans-serif;fill:var(--muted)}.point{cursor:pointer;stroke:white;stroke-width:.7}.point.selected{stroke:var(--ink);stroke-width:2}.point.dim{opacity:.18}.details{border:1px solid var(--teal);border-radius:8px;padding:14px 18px;margin:18px 0;background:#fff;overflow-wrap:anywhere}.details strong{color:var(--teal)}.table-scroll{overflow-x:auto;margin-top:18px}table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}th,td{text-align:right;padding:9px;border-bottom:1px solid var(--line);white-space:nowrap}th:first-child,td:first-child{text-align:left}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.legend span::before{content:"";display:inline-block;width:18px;border-top:3px solid var(--teal);margin-right:6px;vertical-align:middle}.legend .fit::before{border-color:#839397}.legend .expected::before{border-color:var(--orange);border-top-style:dashed}footer{margin-top:25px;color:var(--muted);font-size:12px}a{color:var(--teal)}[hidden]{display:none!important}
@media(max-width:700px){main{padding:20px 14px 35px}.plots{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.controls label{flex:1;min-width:120px}.controls button{width:100%}section.plot{padding:14px 10px}svg text{font-size:13px}.card strong{font-size:23px}}
.plots.overview{grid-template-columns:1fr}.additional{margin-top:16px}.additional>summary{cursor:pointer;padding:10px 0;font-size:14px}.additional>summary:focus-visible{outline:3px solid var(--orange);outline-offset:3px}.additional:not([open])>:not(summary){display:none}.additional[open]>.cards{margin-top:14px}.embedded main{padding:18px 24px}.embedded .eyebrow,.embedded h1,.embedded .source{display:none}@media(max-width:700px){.embedded main{padding:14px}}
</style>
</head>
<body><main>
<div class="eyebrow">MLB · 정규시즌 · 2022–2026</div>
<h1>팀 WAR와 실제 승수</h1>
<p class="source">FanGraphs fWAR · 30팀 × 5시즌</p>
<p id="status" class="banner" role="status"></p>
<div class="controls">
<label>시즌<select id="season"><option value="all">전체 5시즌</option></select></label>
<label>팀 강조<select id="team"><option value="all">전체 팀</option></select></label>
<button id="reset" type="button">전체 복원</button>
</div>
<div id="detail" class="details" aria-live="polite" hidden></div>
<div class="plots overview">
<section class="plot"><h2>WAR와 실제 승수</h2><div class="legend"><span class="fit">회귀선</span></div><svg id="scatter" viewBox="0 0 500 370" role="img" aria-label="팀 WAR와 실제 승수 산점도"></svg></section>
</div>
<details id="additional" class="additional">
<summary>승수 환산 오차와 팀별 추이</summary>
<div class="cards" id="summary" aria-live="polite"></div>
<div class="plots">
<section class="plot wide"><h2>승수 환산 오차</h2><svg id="errors" viewBox="0 0 500 370" role="img" aria-label="실제 승수와 WAR 기반 승수의 차이"></svg></section>
<section class="plot wide"><h2>팀별 5시즌 추이</h2><div class="legend"><span>실제 승수</span><span class="expected">WAR 기반 승수</span></div><svg id="trend" viewBox="0 0 1000 340" role="img" aria-label="각 팀의 5시즌 실제 승수와 WAR 기반 승수"></svg></section>
</div>
<div class="table-scroll"><table id="comparison"><caption>선택 시즌의 fWAR 분석 요약</caption><thead><tr><th>지표</th><th>N</th><th>Pearson</th><th>Spearman</th><th>R²</th><th>평균 차이</th><th>MAE</th><th>RMSE</th><th>±5승 이내</th></tr></thead><tbody></tbody></table></div>
</details>
</main>
<script>
"use strict";
const payload=__WAR_WINS_PAYLOAD__;
if(window.parent!==window)document.body.classList.add('embedded');
const $=id=>document.getElementById(id);
const NS="http://www.w3.org/2000/svg";
let selected=null;
const fmt=(v,d=2)=>v==null?"미확보":Number(v).toFixed(d);
const label=()=>"fWAR";
const create=(tag,attrs={},text=null)=>{const el=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));if(text!==null)el.textContent=text;return el;};
function element(svg,tag,attrs,text){const el=create(tag,attrs,text);svg.append(el);return el;}
function extent(values,pad=4){return [Math.floor(Math.min(...values)-pad),Math.ceil(Math.max(...values)+pad)];}
function chart(id,xrange,yrange,xlabel,ylabel,width=500,height=370){
 const svg=$(id);svg.replaceChildren();const m={left:55,right:22,top:20,bottom:55};
 const x=v=>m.left+(v-xrange[0])/(xrange[1]-xrange[0])*(width-m.left-m.right);
 const y=v=>height-m.bottom-(v-yrange[0])/(yrange[1]-yrange[0])*(height-m.top-m.bottom);
 for(let i=0;i<=5;i++){let xv=xrange[0]+(xrange[1]-xrange[0])*i/5,yv=yrange[0]+(yrange[1]-yrange[0])*i/5;
  element(svg,"line",{x1:x(xrange[0]),x2:x(xrange[1]),y1:y(yv),y2:y(yv),stroke:"#eef0ee"});
  element(svg,"text",{x:x(xv),y:height-32,"text-anchor":"middle"},fmt(xv,0));
  element(svg,"text",{x:45,y:y(yv)+4,"text-anchor":"end"},fmt(yv,0));
 }
 element(svg,"text",{x:(width+25)/2,y:height-5,"text-anchor":"middle"},xlabel);
 element(svg,"text",{transform:`translate(15 ${(height-30)/2}) rotate(-90)`,"text-anchor":"middle"},ylabel);
 return {svg,x,y,xrange,yrange};
}
function line(c,x1,y1,x2,y2,color,dash=""){
 element(c.svg,"line",{x1:c.x(x1),y1:c.y(y1),x2:c.x(x2),y2:c.y(y2),stroke:color,"stroke-width":1.5,"stroke-dasharray":dash});
}
function point(c,row,xv,yv,provider){
 const chosen=$('team').value,dim=chosen!=="all"&&String(row.team_id)!==chosen;
 const key=`${row.season}-${row.team_id}`;
 const description=`${row.season} ${row.team}: ${label(provider)} ${fmt(row[provider])}, 실제 ${row.wins}승`+($('additional').open?`, 차이 ${fmt(row[provider+'_error'])}승`:'');
 const circle=element(c.svg,"circle",{cx:c.x(xv),cy:c.y(yv),r:dim?3.4:4.8,fill:chosen!=="all"&&!dim?"#df744d":"#157b8c",tabindex:0,role:"button",class:"point"+(dim?" dim":"")+(selected===key?" selected":""),"data-key":key,"data-season":row.season,"data-team":row.team_id,"aria-label":description});
 const choose=()=>{selected=key;showDetail(row);render(false);};
 circle.addEventListener("click",choose);circle.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();choose();}});
 element(circle,"title",{},circle.getAttribute("aria-label"));
}
function showDetail(row){
 const p='fwar',d=$('detail');d.replaceChildren();d.hidden=false;
 const heading=document.createElement('strong');heading.textContent=`${row.season} ${row.team}`;d.append(heading,document.createElement('br'));
 d.append(document.createTextNode(`${row.games}경기 · 실제 ${row.wins}승 ${row.losses}패 · ${label(p)} ${fmt(row[p])}`));
 if($('additional').open)d.append(document.createTextNode(` (타격·주루·수비 ${fmt(row[p+'_bat'])} + 투수 ${fmt(row[p+'_pit'])}) · WAR 기반 ${fmt(row[p+'_expected'])}승 · 차이 ${row[p+'_error']>=0?'+':''}${fmt(row[p+'_error'])}승`));
 d.dataset.key=`${row.season}-${row.team_id}`;
}
function summary(provider,season){
 const s=payload.summaries[provider][season],root=$('summary');root.replaceChildren();
 for(const [name,value] of [["팀–시즌",s?s.n:"미확보"],["Pearson r",fmt(s?.raw.pearson,3)],["평균 절대오차",s?fmt(s.mae)+"승":"미확보"],["±5승 이내",s?fmt(s.within_5*100,1)+"%":"미확보"]]){
  const box=document.createElement('div');box.className='card';const title=document.createElement('span'),v=document.createElement('strong');title.textContent=name;v.textContent=value;box.append(title,v);root.append(box);
 }
 root.dataset.n=s?s.n:0;
 const body=$('comparison').querySelector('tbody');body.replaceChildren();
 for(const p of ['fwar']){const m=payload.summaries[p][season],tr=document.createElement('tr');
  const values=m?[label(p),m.n,fmt(m.raw.pearson,3),fmt(m.raw.spearman,3),fmt(m.raw.r_squared,3),fmt(m.bias),fmt(m.mae),fmt(m.rmse),fmt(m.within_5*100,1)+'%']:[label(p),0,'미확보','미확보','미확보','미확보','미확보','미확보','미확보'];
  for(const value of values){const td=document.createElement('td');td.textContent=value;tr.append(td);}body.append(tr);
 }
}
function render(clear=true){
 const p='fwar',season=$('season').value,team=$('team').value;
 if(clear){selected=null;$('detail').hidden=true;}
 const all=payload.rows.filter(r=>r[p]!==null),rows=all.filter(r=>season==='all'||String(r.season)===season);
 summary(p,season);
 if(!rows.length){for(const id of ['scatter','errors','trend']){$(id).replaceChildren();element($(id),'text',{x:35,y:80},'이 WAR 자료는 아직 확보되지 않았습니다.');}return;}
 const xr=extent(all.map(r=>r[p])),yr=extent(all.map(r=>r.wins));
 const scatter=chart('scatter',xr,yr,'팀 '+label(p),'실제 승수');
 const reg=payload.summaries[p][season].raw;
 // Clip regression endpoints to the visible y range.
 function segment(slope,intercept,color,dash){
  let lo=xr[0],hi=xr[1];if(slope!==0){const a=(yr[0]-intercept)/slope,b=(yr[1]-intercept)/slope;lo=Math.max(lo,Math.min(a,b));hi=Math.min(hi,Math.max(a,b));}
  if(lo<=hi)line(scatter,lo,intercept+slope*lo,hi,intercept+slope*hi,color,dash);
 }
 if(reg.slope!==null)segment(reg.slope,reg.intercept,'#839397','');
 rows.forEach(r=>point(scatter,r,r[p],r.wins,p));
 const ey=extent([...all.map(r=>r[p+'_error']),-5,5],2),ex=extent(all.map(r=>r.wins));
 const errors=chart('errors',ex,ey,'실제 승수','실제 − WAR 기반 승수');
 const band=create('rect',{x:errors.x(ex[0]),y:errors.y(5),width:errors.x(ex[1])-errors.x(ex[0]),height:errors.y(-5)-errors.y(5),fill:'#157b8c',opacity:.07});errors.svg.prepend(band);
 line(errors,ex[0],0,ex[1],0,'#839397');rows.forEach(r=>point(errors,r,r.wins,r[p+'_error'],p));
 const ty=extent([...all.map(r=>r.wins),...all.map(r=>r[p+'_expected'])],5);
 const trendWidth=document.body.clientWidth<700?500:1000;
 $('trend').setAttribute('viewBox',`0 0 ${trendWidth} 340`);
 const trend=chart('trend',[2021.7,2026.3],ty,'시즌','승수',trendWidth,340);
 // Explicit year labels avoid fractional/duplicated year ticks.
 [...trend.svg.querySelectorAll('text')].filter(t=>t.getAttribute('y')==='308').forEach(t=>t.remove());
 for(const year of payload.seasons){element(trend.svg,'text',{x:trend.x(year),y:308,'text-anchor':'middle'},year);if(String(year)===season)element(trend.svg,'line',{x1:trend.x(year),x2:trend.x(year),y1:20,y2:285,stroke:'#df744d','stroke-dasharray':'3 4',opacity:.4});}
 const tids=[...new Set(all.map(r=>r.team_id))].sort((a,b)=>(String(a)===team)-(String(b)===team));
 for(const tid of tids){const series=all.filter(r=>r.team_id===tid).sort((a,b)=>a.season-b.season),active=String(tid)===team;
  for(const expected of [false,true]){const path=series.map((r,i)=>(i?'L':'M')+trend.x(r.season)+','+trend.y(expected?r[p+'_expected']:r.wins)).join(' ');
   element(trend.svg,'path',{d:path,fill:'none',stroke:expected?'#df744d':'#157b8c','stroke-width':active?2.8:1,opacity:active?1:(team==='all'?.18:.06),'stroke-dasharray':expected?'5 4':'','data-team':tid});
  }if(active)series.forEach(r=>point(trend,r,r.season,r.wins,p));
 }
 if(selected){const row=all.find(r=>`${r.season}-${r.team_id}`===selected);if(row)showDetail(row);}
 fitWarFrame();
}
for(const year of payload.seasons){const o=document.createElement('option');o.value=year;o.textContent=year;$('season').append(o);}
const teamNames=new Map();payload.rows.forEach(r=>teamNames.set(r.team_id,r.team));
for(const [id,name] of [...teamNames].sort((a,b)=>a[1].localeCompare(b[1]))){const o=document.createElement('option');o.value=id;o.textContent=name;$('team').append(o);}
$('status').hidden=payload.status==='complete';
if(payload.status!=='complete')$('status').textContent=`fWAR ${payload.coverage.fwar}/150개 팀·시즌. 수집·검증 상태를 확인해 주세요.`;
for(const id of ['season','team'])$(id).addEventListener('change',()=>render());
$('reset').addEventListener('click',()=>{$('season').value='all';$('team').value='all';$('additional').open=false;render();});
$('additional').addEventListener('toggle',()=>render(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){selected=null;$('detail').hidden=true;render(false);}});
render();
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>render(false),100);});
function fitWarFrame(){
 if(window.parent===window)return;
 document.documentElement.style.overflowY='hidden';
 const height=Math.ceil(document.body.getBoundingClientRect().height)+8;
 try{const frame=window.frameElement;if(frame&&Math.abs(frame.clientHeight-height)>1)frame.style.height=height+'px';}catch(error){}
 window.parent.postMessage({type:'mlb-war-wins-height',height},'*');
}
window.addEventListener('message',event=>{if(event.source===window.parent&&event.data?.type==='mlb-war-wins-resize')fitWarFrame();});
new ResizeObserver(fitWarFrame).observe(document.body);
window.addEventListener('load',fitWarFrame);if(document.fonts)document.fonts.ready.then(fitWarFrame);fitWarFrame();
</script>
</body></html>
