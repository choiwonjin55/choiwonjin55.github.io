<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2023~2026 MLB 타율과 득타율</title>
<style>
:root{font-family:system-ui,"Malgun Gothic",sans-serif;color:#243a40;background:#fbfaf7;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:24px 18px}main{max-width:1060px;margin:auto}h1{font-size:clamp(22px,4vw,30px);margin:0 0 18px}h2{font-size:18px}p{line-height:1.7}label{display:grid;gap:7px;max-width:340px}select{font:inherit;background:#fff;border:1px solid #b5c5c8;border-radius:8px;padding:10px}.charts{display:grid;grid-template-columns:1fr 1fr;gap:20px}.charts section{min-width:0}svg{display:block;width:100%;height:auto}.legend{display:flex;flex-wrap:wrap;gap:18px;font-size:14px}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--color);margin-right:6px}.point{cursor:pointer;stroke:#fbfaf7;stroke-width:.6}.point:focus{outline:none;stroke:#243a40;stroke-width:2}.selected{stroke:#243a40;stroke-width:2}#detail{min-height:30px;font-size:14px;color:#126b80}select:focus-visible{outline:3px solid #da7750;outline-offset:2px}@media(max-width:740px){body{padding:20px 12px}.charts{grid-template-columns:1fr;gap:4px}}
</style></head><body><main>
<h1>선수별 타율과 득타율</h1>
<label>시즌<select id="season"></select></label><p id="summary"></p>
<div class="legend"><span style="--color:#157b8c">득타율 > 타율</span><span style="--color:#84959e">득타율 < 타율</span></div>
<div class="charts"><section><h2>타율과 득타율</h2><svg id="rates" role="img" aria-label="선수별 타율과 득타율 산점도"></svg></section><section><h2>두 타율 차이의 분포</h2><svg id="distribution" role="img" aria-label="선수별 득타율과 타율 차이의 분포"></svg></section></div>
<p id="detail" aria-live="polite"></p>
<noscript><img src="../assets/mlb-clutch-2026/four-season-overview.png" alt="2023~2026년 선수별 타율과 득타율" style="width:100%;height:auto"></noscript>
</main><script id="analysis-data" type="application/json">__FOUR_SEASON_OVERVIEW__</script>
<script>
'use strict';
const overview=JSON.parse(document.getElementById('analysis-data').textContent),$=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const element=(tag,attrs,text)=>{const node=document.createElementNS(NS,tag);for(const [key,value] of Object.entries(attrs))node.setAttribute(key,value);if(text!==undefined)node.textContent=text;return node;};
$('season').appendChild(new Option('전체','all'));
for(const year of Object.keys(overview.years))$('season').appendChild(new Option(year+'년',year));$('season').value='all';
const all=Object.entries(overview.years).flatMap(([season,year])=>year.players.map(p=>({...p,season}))),low=Math.min(...all.flatMap(p=>[p.avg,p.risp_avg]))-.01,high=Math.max(...all.flatMap(p=>[p.avg,p.risp_avg]))+.03;
const bound=Math.ceil(Math.max(...all.map(p=>Math.abs(p.delta)))/.015)*.015;
const step=2*bound/24;
function histogram(rows){const counts=Array(24).fill(0);for(const p of rows)counts[Math.min(23,Math.max(0,Math.floor((p.delta+bound)/step)))]++;return counts;}
const histogramMax=Math.ceil(Math.max(...histogram(all))*1.15);
function axes(svg,xmin,xmax,ymin,ymax,xlabel,ylabel,countAxis=false){svg.replaceChildren();const width=Math.max(320,Math.round(svg.getBoundingClientRect().width)),height=Math.max(400,Math.min(480,width*.9));svg.setAttribute('viewBox',`0 0 ${width} ${height}`);const X=value=>85+(value-xmin)/(xmax-xmin)*(width-105),Y=value=>height-65-(value-ymin)/(ymax-ymin)*(height-95);const ticks=width<500?3:5;
 for(let i=0;i<=ticks;i++){const xv=xmin+(xmax-xmin)*i/ticks,yv=ymin+(ymax-ymin)*i/ticks;svg.appendChild(element('line',{x1:85,x2:width-20,y1:Y(yv),y2:Y(yv),stroke:'#e1e8e8'}));svg.appendChild(element('text',{x:77,y:Y(yv)+5,'text-anchor':'end','font-size':14},countAxis?Math.round(yv):yv.toFixed(3)));svg.appendChild(element('text',{x:X(xv),y:height-37,'text-anchor':'middle','font-size':14},xv.toFixed(3)));}
 svg.appendChild(element('text',{x:width/2,y:height-8,'text-anchor':'middle','font-size':16},xlabel));svg.appendChild(element('text',{x:18,y:height/2,transform:`rotate(-90 18 ${height/2})`,'text-anchor':'middle','font-size':16},ylabel));return {X,Y};}
function drawOverview(){const season=$('season').value,isAll=season==='all',year=overview.years[season],rows=isAll?all:year.players.map(p=>({...p,season}));$('summary').textContent=isAll?'2023~2026년 · 선수 '+new Set(all.map(p=>p.player_id)).size+'명 · '+all.length+'개 시즌 기록':year.n+'명 중 득타율이 타율보다 높은 선수 '+year.positive+'명 ('+(year.positive_share*100).toFixed(1)+'%)';$('detail').textContent='';
 const rates=$('rates'),a=axes(rates,low,high,low,high,'전체 타율','득점권 타율');rates.appendChild(element('line',{x1:a.X(low),y1:a.Y(low),x2:a.X(high),y2:a.Y(high),stroke:'#768897','stroke-dasharray':'5 4'}));
 for(const p of rows){const positive=p.risp_h*p.ab>p.h*p.risp_ab,label=p.name+' · '+p.season+'년',circle=element('circle',{cx:a.X(p.avg),cy:a.Y(p.risp_avg),r:isAll?3.2:4.2,fill:positive?'#157b8c':'#84959e',opacity:isAll?.5:.8,class:'point',tabindex:0,role:'button','aria-label':label+' 타율 '+p.avg.toFixed(3)+' 득타율 '+p.risp_avg.toFixed(3)});circle.dataset.id=p.player_id;circle.dataset.season=p.season;circle.appendChild(element('title',{},label+' · '+p.avg.toFixed(3)+' / '+p.risp_avg.toFixed(3)));const choose=()=>{rates.querySelectorAll('.selected').forEach(node=>node.classList.remove('selected'));circle.classList.add('selected');$('detail').textContent=label+' · 타율 '+p.avg.toFixed(3)+' · 득타율 '+p.risp_avg.toFixed(3)+' · 차이 '+(p.delta>=0?'+':'')+p.delta.toFixed(3);fitClutchFrame();};circle.addEventListener('click',choose);circle.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();choose();}});rates.appendChild(circle);}
 const counts=histogram(rows);
 const distribution=$('distribution'),b=axes(distribution,-bound,bound,0,histogramMax,'득타율 − 전체 타율',isAll?'시즌 기록 수':'선수 수',true);
 counts.forEach((count,i)=>{const left=-bound+i*step,rectangle=element('rect',{x:b.X(left),y:b.Y(count),width:Math.max(0,b.X(left+step)-b.X(left)-.4),height:b.Y(0)-b.Y(count),fill:i>=12?'#157b8c':'#84959e',opacity:.85,class:'histogram-bin'});rectangle.dataset.count=count;distribution.appendChild(rectangle);});distribution.appendChild(element('line',{x1:b.X(0),x2:b.X(0),y1:b.Y(0),y2:b.Y(histogramMax),stroke:'#768897'}));
 fitClutchFrame();
}
$('season').addEventListener('change',drawOverview);window.addEventListener('resize',drawOverview);drawOverview();
// Size the embedding frame from natural body height, so it can grow and shrink.
function fitClutchFrame(){try{const frame=window.frameElement;if(!frame)return;const height=Math.ceil(document.body.getBoundingClientRect().height)+8;if(Math.abs(frame.clientHeight-height)>1)frame.style.height=height+'px';}catch(error){}}
new ResizeObserver(()=>requestAnimationFrame(fitClutchFrame)).observe(document.body);window.addEventListener('load',fitClutchFrame);if(document.fonts)document.fonts.ready.then(fitClutchFrame);fitClutchFrame();
</script></body></html>
